name: Splitty
description: >-
  Splitty (splittytravel.com) is a Techstars-backed online travel company that offered
  discounted hotel bookings by algorithmically splitting a single multi-night stay across
  separate reservations to surface lower nightly rates. The consumer service has since been
  wound down and now operates as "Splitty by trivago DEALS Ltd." - it no longer accepts new
  bookings and only lets existing customers manage their reservations, redirecting new hotel
  searches to trivago DEALS (trivago.DEALS). Splitty publishes no public developer program,
  API, or documentation surface.
